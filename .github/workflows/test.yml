name: Kjøre tester

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    name: Bygg og test
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble

    steps:
      - name: Sjekke ut kodelager
        uses: actions/checkout@v4

      - name: Installere PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Installere Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Installere avhengigheter
        run: pnpm install --frozen-lockfile

      - name: Kodestil
        run: pnpm codestyle

      - name: Bygge
        run: pnpm run build

      - name: Kodesjekk
        run: pnpm lint

      - name: Installere Playwright
        run: pnpm --filter tomas-designsystem --filter tomas-designsystem-react exec playwright install --with-deps

      - name: Test
        run: pnpm run test

      - name: Laste opp testdekningsinformasjon
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage-report
          path: |
            packages/web/coverage/
            packages/react/coverage/

      - name: Testdekning Web
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Web
          json-summary-path: ./packages/web/coverage/coverage-summary.json
          json-final-path: ./packages/web/coverage/coverage-final.json

      - name: Testdekning React
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: React
          json-summary-path: ./packages/react/coverage/coverage-summary.json
          json-final-path: ./packages/react/coverage/coverage-final.json
