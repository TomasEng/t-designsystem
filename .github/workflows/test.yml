name: Kjøre tester

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    name: Bygg og test
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble

    steps:
      - name: Sjekke ut kodelager
        uses: actions/checkout@v4

      - name: Installere PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Installere Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Installere avhengigheter
        run: pnpm install --frozen-lockfile

      - name: Kodestil
        run: pnpm codestyle

      - name: Bygge
        run: pnpm run build

      - name: Kodesjekk
        run: pnpm lint

      - name: Installere Playwright
        run: pnpm --filter tomas-designsystem --filter tomas-designsystem-react exec playwright install --with-deps

      - name: Test
        run: pnpm run test

      - name: Laste opp testdekningsinformasjon
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage-report
          path: |
            packages/web/coverage/
            packages/react/coverage/

      - name: Testdekning Web
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Web
          json-summary-path: ./packages/web/coverage/coverage-summary.json
          json-final-path: ./packages/web/coverage/coverage-final.json

      - name: Testdekning React
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: React
          json-summary-path: ./packages/react/coverage/coverage-summary.json
          json-final-path: ./packages/react/coverage/coverage-final.json

      - name: Hente testdekningsdata
        if: ${{ github.ref == 'refs/heads/master' }}
        id: testdekning
        shell: bash
        run: |
          {
            echo 'coverageSummaryWeb<<EOF'
            cat ./packages/web/coverage/coverage-summary.json
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          {
            echo 'coverageSummaryReact<<EOF'
            cat ./packages/react/coverage/coverage-summary.json
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          node <<'NODE' >> "$GITHUB_OUTPUT"
          const web = require("./packages/web/coverage/coverage-summary.json");
          const react = require("./packages/react/coverage/coverage-summary.json");
          const covered = web.total.lines.covered + react.total.lines.covered;
          const total = web.total.lines.total + react.total.lines.total;
          console.log(`coverageMessage=${covered}/${total} linjer`);
          NODE

      - name: Oppdatere testdekningsetikett
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 77fc5f17b0b68c757f10ed957a0f41a9
          filename: testdekning.svg
          label: Testdekning
          message: "${{ steps.testdekning.outputs.coverageMessage }}"
          color: green
